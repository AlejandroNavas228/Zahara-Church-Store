<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | Zahara Church Store</title>
    <link rel="icon" type="image/png" href="assets/img/logo.jpeg">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/detalle.css">
    <meta property="og:image" content="assets/img/logo.jpeg">
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #000; color: #fff; margin: 0; font-family: 'Montserrat', sans-serif;">

    <!-- Botón para volver a la tienda -->
    <div style="max-width: 1100px; margin: 20px auto 0; padding: 0 20px;">
        <a href="index.html" style="text-decoration: none; color: #fff; font-size: 1rem; font-weight: bold; display: inline-block; padding: 10px 0; border-bottom: 1px solid transparent; transition: 0.3s;" onmouseover="this.style.borderBottom='1px solid #fff'" onmouseout="this.style.borderBottom='1px solid transparent'">
            <i class="fa-solid fa-chevron-left"></i> Volver a la tienda
        </a>
    </div>

    <!-- Contenedor donde JS inyectará el producto -->
    <div class="detalle-container" id="info-producto" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <h2 style="text-align: center; color: white;">Cargando producto... ⏳</h2>
    </div>

    <script src="js/productos.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Completar Pedido - Zahara Store</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <meta property="og:title" content="Zahara Church Store 🔥">
    <meta property="og:description" content="Descubre nuestra nueva colección. Ropa con propósito y el mejor estilo. ¡Compra online ahora!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zaharachurch.store">
    <meta property="og:image" content="assets/img/logo.jpeg">
</head>
<body class="bg-checkout">

    <div style="max-width: 1000px; margin: 20px auto 0; padding: 0 20px;">
        <a href="index.html" style="text-decoration: none; color: #28a745; font-size: 1em; font-weight: bold; transition: 0.3s;">
            <i class="fa-solid fa-chevron-left"></i> Volver a la tienda
        </a>
    </div>

    <header class="checkout-header">
        <h1>ZAHARA STORE</h1>
    </header>

    <div class="checkout-container">
        <div class="checkout-left">
            
            <section class="checkout-section">
                <h2>Datos de Facturación y Envío</h2>
                <p class="subtitle" style="margin-bottom: 20px; color: #aaa;">Completa esta información para generar tu pedido y coordinar el pago por WhatsApp.</p>
                
                <input type="text" id="cliente-nombre" class="input-checkout" placeholder="Nombre y Apellido" required style="margin-bottom: 15px;">
                
                <input type="text" id="cliente-cedula" class="input-checkout" placeholder="Cédula / RIF" required style="margin-bottom: 15px;">
                
                <input type="tel" id="cliente-telefono" class="input-checkout" placeholder="Teléfono (WhatsApp)" required style="margin-bottom: 15px;">
                
                <textarea id="cliente-direccion" class="input-checkout" placeholder="Dirección exacta de entrega" rows="3" style="width: 100%; resize: none; margin-bottom: 15px;" required></textarea>
            </section>

            <!-- Botón siempre visible y directo a WhatsApp -->
            <button id="btn-finalizar-compra" class="btn-block" style="display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 1.1rem; padding: 18px; background-color: #25D366; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 8px;">
                FINALIZAR COMPRA POR WHATSAPP <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i>
            </button>
        </div>

        <div class="checkout-right">
            <h2 style="color: #fff; margin-top: 0; margin-bottom: 20px; font-size: 1.2rem;">Resumen de tu Orden</h2>
            
            <div id="resumen-carrito" class="resumen-items"></div>
            
            <div class="resumen-totales">
                <div class="fila-total" style="border-top: 2px solid #333; padding-top: 15px;">
                    <span style="font-size: 1.2rem;">Total a Pagar</span>
                    <div style="text-align: right;">
                        <span id="checkout-total" style="color: #28a745; font-size: 1.5rem; font-weight: 900; display: block;">€0.00</span>
                        <span id="checkout-total-bs" style="color: #888; font-size: 0.9rem; font-weight: normal; display: block; margin-top: 5px;">Bs. 0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/checkout.js"></script> 
</body>
</html>
